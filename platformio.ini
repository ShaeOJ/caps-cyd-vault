; ============================================================
; CAPS CYD Vault — Air-Gapped Cold Hardware Wallet for Bottlecaps (BCAP)
; Target Board: ESP32-2432S028R (Cheap Yellow Display 2.8")
;
; Features:
;   - 100% Air-Gapped Operation (No WiFi / Bluetooth compiled or active)
;   - MicroSD Card PSBT Transaction Signing (Coldcard model)
;   - On-Screen High-Contrast QR Code for Receiving & Signed Tx Broadcast
;   - 2.8" ILI9341 Color Display with Pip-Boy / Wasteland Amber & Green UI
;   - Resistive Touchscreen (XPT2046)
;   - Full secp256k1, BIP-39, BIP-32 HD derivation, SegWit Bech32 (caps1...)
;
; Build:   pio run -e cyd28r
; Flash:   pio run -e cyd28r -t upload --upload-port COM4
; Monitor: pio device monitor -b 115200 -p COM4
; ============================================================

[platformio]
default_envs = cyd28r

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen
    bblanchon/ArduinoJson@^7.0.4
    ricmoo/QRCode@^0.0.1
    stepansnigirev/uBitcoin@^0.2.0

; ---- Shared TFT_eSPI fonts ----
[common_fonts]
build_flags =
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; ============================================================
; CYD 2.8" (ESP32-2432S028R) — ILI9341 240x320 Display
; ============================================================
[cyd28_display]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=12
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSCR_W=320
    -DSCR_H=240

[env:cyd28r]
upload_flags =
    --before=no_reset
    --after=hard_reset
build_flags =
    ${cyd28_display.build_flags}
    ${common_fonts.build_flags}
    ; --- XPT2046 resistive touch on separate bus ---
    -DTOUCH_CS=33
    -DTOUCH_IRQ=36
    -DTOUCH_CLK=25
    -DTOUCH_MOSI=32
    -DTOUCH_MISO=39
    ; --- SD card on VSPI ---
    -DSD_CS=5
    -DSD_MOSI=23
    -DSD_MISO=19
    -DSD_SCK=18
    ; --- RGB Status LED ---
    -DLED_R=4
    -DLED_G=16
    -DLED_B=17
    ; --- App config ---
    -DCORE_DEBUG_LEVEL=1

