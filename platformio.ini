; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cyd28r

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/tamctec/gt911-arduino.git
	fbiego/CST816S@^1.3.0
	nitek/XPT2046_Bitbang_Slim@^2.0.0
	bblanchon/ArduinoJson@^7.0.4
	ricmoo/QRCode@^0.0.1
	stepansnigirev/uBitcoin@^0.2.0

[common_fonts]
build_flags = 
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1

[cyd28_display]
build_flags = 
	-DUSER_SETUP_LOADED=1
	-DST7796_DRIVER=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=27
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_RGB_ORDER=TFT_BGR
	-DSPI_FREQUENCY=65000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DSCR_W=480
	-DSCR_H=320

[env:cyd28r]
upload_port = COM4
upload_speed = 921600
monitor_port = COM4
lib_deps = 
	${env.lib_deps}
	fbiego/CST816S@^1.3.0
build_flags = 
	${cyd28_display.build_flags}
	${common_fonts.build_flags}
	-I include
	-I src
	-DTOUCH_CS=33
	-DTOUCH_IRQ=36
	-DTOUCH_CLK=25
	-DTOUCH_MOSI=32
	-DTOUCH_MISO=39
	-DSD_CS=5
	-DSD_MOSI=23
	-DSD_MISO=19
	-DSD_SCK=18
	-DLED_R=4
	-DLED_G=16
	-DLED_B=17
	-DCORE_DEBUG_LEVEL=1
